[workspace]
resolver = "2"
members = ["candle-core", "candle-cli", "log-collector"]

[workspace.package]
version = "0.14.0"
edition = "2021"
license = "MIT"
description = "A process manager for local development, worktrees, and AI agents"
repository = "https://github.com/facetlayer/candle"
homepage = "https://github.com/facetlayer/candle"
authors = ["Andy Fischer <andy.fischer@gmail.com>"]
keywords = ["process-manager", "cli", "development", "logs"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
clap = { version = "4", features = ["derive"] }
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
strip = true
