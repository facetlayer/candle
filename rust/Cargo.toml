[package]
name = "candle"
version = "0.14.0"
edition = "2021"
license = "MIT"
description = "A process manager for local development, worktrees, and AI agents"
repository = "https://github.com/facetlayer/candle"
homepage = "https://github.com/facetlayer/candle"
authors = ["Andy Fischer <andy.fischer@gmail.com>"]
keywords = ["process-manager", "cli", "development", "logs"]
categories = ["command-line-utilities", "development-tools"]

# One crate, one binary. The library target exists so the integration tests in
# ./tests can drive internals directly; everything ships inside the single
# `candle` executable, including the log-monitor mode (`candle --monitor`).
[lib]
name = "candle"
path = "src/lib.rs"

[[bin]]
name = "candle"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
libc = "0.2"
include_dir = "0.7"

[profile.release]
opt-level = "s"
lto = true
strip = true
