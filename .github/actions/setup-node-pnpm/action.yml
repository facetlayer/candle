name: 'Setup Node and pnpm with caching'
description: 'Setup Node.js, enable corepack, and restore pnpm/node_modules caches'

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Enable Corepack
      shell: bash
      run: corepack enable

    - name: Authenticate to GitHub Packages
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        # @facetlayer/subprocess resolves from GitHub Packages
        # (npm.pkg.github.com), which returns 401 for unauthenticated requests.
        # The runner's GITHUB_TOKEN authenticates here; note the package must
        # also grant read access to this repo or the download returns 403.
        echo "//npm.pkg.github.com/:_authToken=${GITHUB_TOKEN}" >> "$HOME/.npmrc"

    - name: Restore pnpm cache
      uses: actions/cache/restore@v4
      with:
        path: |
          ~/.local/share/pnpm/store
          ~/.cache/pnpm
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
