name: Release

# Publishes prebuilt binaries to a GitHub Release when a version tag is pushed:
#
#     git tag v0.13.4 && git push origin v0.13.4
#
# Each platform job builds `candle` + `log-collector` and uploads a tarball
# containing both (they must be installed side by side — `candle` resolves the
# sidecar as a sibling of its own executable).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build a release for'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          # Cross-compiled from the arm64 runner: GitHub retired the macos-13
          # (Intel) image, so a native x86_64 macOS job hangs forever waiting
          # for a runner that no longer exists. Apple's clang and SDK target
          # both architectures, so this needs no extra tooling.
          - target: x86_64-apple-darwin
            os: macos-14
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build release binaries
        working-directory: rust
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          NAME="candle-${TAG}-${{ matrix.target }}"
          STAGE="$(mktemp -d)/$NAME"
          mkdir -p "$STAGE"
          cp rust/target/${{ matrix.target }}/release/candle "$STAGE/"
          cp rust/target/${{ matrix.target }}/release/log-collector "$STAGE/"
          cp README.md LICENSE "$STAGE/"
          tar -czf "$NAME.tar.gz" -C "$(dirname "$STAGE")" "$NAME"
          echo "archive=$NAME.tar.gz" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        working-directory: artifacts
        run: sha256sum *.tar.gz > SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes \
            || gh release upload "$TAG" artifacts/* --repo "$GITHUB_REPOSITORY" --clobber

  homebrew:
    name: update homebrew tap
    needs: release
    runs-on: ubuntu-latest
    # Requires a HOMEBREW_TAP_TOKEN secret: a PAT with `contents: write` on
    # facetlayer/homebrew-tap. Skipped automatically when the secret is absent.
    steps:
      - name: Check for tap token
        id: check
        run: |
          if [ -n "${{ secrets.HOMEBREW_TAP_TOKEN }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::HOMEBREW_TAP_TOKEN not set — skipping Homebrew tap update."
          fi

      - name: Checkout tap
        if: steps.check.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          repository: facetlayer/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Download checksums
        if: steps.check.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --dir .

      - name: Write formula
        if: steps.check.outputs.enabled == 'true'
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          sha_for() { grep " candle-${TAG}-$1.tar.gz\$" SHA256SUMS | awk '{print $1}'; }
          mkdir -p tap/Formula
          cat > tap/Formula/candle.rb <<EOF
          # This file is generated by facetlayer/candle .github/workflows/release.yml
          class Candle < Formula
            desc "Process manager for local development, worktrees, and AI agents"
            homepage "https://github.com/facetlayer/candle"
            version "$VERSION"
            license "MIT"

            on_macos do
              on_arm do
                url "https://github.com/facetlayer/candle/releases/download/$TAG/candle-$TAG-aarch64-apple-darwin.tar.gz"
                sha256 "$(sha_for aarch64-apple-darwin)"
              end
              on_intel do
                url "https://github.com/facetlayer/candle/releases/download/$TAG/candle-$TAG-x86_64-apple-darwin.tar.gz"
                sha256 "$(sha_for x86_64-apple-darwin)"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/facetlayer/candle/releases/download/$TAG/candle-$TAG-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "$(sha_for aarch64-unknown-linux-gnu)"
              end
              on_intel do
                url "https://github.com/facetlayer/candle/releases/download/$TAG/candle-$TAG-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "$(sha_for x86_64-unknown-linux-gnu)"
              end
            end

            def install
              # Both binaries must land in the same directory: candle resolves
              # log-collector as a sibling of its own executable.
              bin.install "candle"
              bin.install "log-collector"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/candle --version")
            end
          end
          EOF

      - name: Commit formula
        if: steps.check.outputs.enabled == 'true'
        working-directory: tap
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Stage first, then compare against the index: on the very first
          # release Formula/candle.rb is untracked, and `git diff` alone does
          # not report untracked files.
          git add Formula/candle.rb
          if git diff --cached --quiet; then
            echo "formula unchanged"
            exit 0
          fi
          git commit -m "candle $TAG"
          git push
